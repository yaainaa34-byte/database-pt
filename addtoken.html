<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gyzen</title><style>body{background:#0e0e0e;color:#fff;font-family:Arial;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0}.card{background:#1c1c1c;padding:25px;border-radius:16px;width:90%;max-width:380px}input{width:100%;padding:12px;margin:8px 0;background:#2a2a2a;border:1px solid #333;border-radius:10px;color:#fff;box-sizing:border-box}button{width:100%;padding:12px;background:#0088cc;border:none;border-radius:10px;color:#fff;font-weight:bold;margin-top:10px}.hidden{display:none}</style></head><body><div class="card"><div id="loginBox"><h2 style="text-align:center">Login</h2><input id="username" placeholder="Username"><input id="password" type="password" placeholder="Password"><button onclick="login()">MASUK</button><div id="loginStatus" style="text-align:center;margin-top:10px;color:#ff5e5e"></div></div><div id="dashboardBox" class="hidden"><h3 style="text-align:center">Tambah Bot</h3><input id="token" placeholder="Token Bot"><input id="targetUsername" placeholder="Username Bot"><input id="targetPassword" placeholder="Password Bot"><button onclick="addToDatabase()">TAMBAHKAN</button><div id="status" style="margin-top:15px;font-size:13px;color:#aaa">Siap</div></div></div><script>
const GITHUB_OWNER="yaainaa34-byte";const GITHUB_REPO="database-pt";const GITHUB_TOKEN="ghp_LU_GANTI_DISINI";const ROLE_FILES={owner:"owner.json",moderator:"moderator.json",pt:"pt.json",reseller:"res.json",tk:"tk.json"};
async function login(){const u=document.getElementById("username").value.trim();const p=document.getElementById("password").value.trim();if(!u||!p){document.getElementById("loginStatus").innerText="Isi semua!";return;}document.getElementById("loginStatus").innerText="Mencari...";for(let r in ROLE_FILES){let url=`https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${ROLE_FILES[r]}?t=${Date.now()}`;try{let res=await fetch(url);if(!res.ok)continue;let d=await res.json();if(d.find(x=>x.username===u&&x.password===p)){document.getElementById("loginBox").classList.add("hidden");document.getElementById("dashboardBox").classList.remove("hidden");document.getElementById("status").innerText="Login sebagai "+r+" : "+u;return;}}catch(e){}}document.getElementById("loginStatus").innerText="Akun tidak ditemukan!";}
async function addToDatabase(){const token=document.getElementById("token").value.trim();const tU=document.getElementById("targetUsername").value.trim();const tP=document.getElementById("targetPassword").value.trim();if(!token||!tU||!tP){alert("Isi semua");return;}document.getElementById("status").innerText="Menambahkan...";const api=`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/tokens.json`;try{let ex=[];let sha=null;let get=await fetch(api,{headers:{Authorization:`Bearer ${GITHUB_TOKEN}`}});if(get.ok){let j=await get.json();sha=j.sha;ex=JSON.parse(atob(j.content));}ex.push({token,username:tU,password:tP,date:new Date().toISOString()});let content=btoa(unescape(encodeURIComponent(JSON.stringify(ex,null,2))));let put=await fetch(api,{method:"PUT",headers:{Authorization:`Bearer ${GITHUB_TOKEN}`,"Content-Type":"application/json"},body:JSON.stringify({message:`Add ${tU}`,content,sha})});if(put.ok)document.getElementById("status").innerText="Berhasil tambah "+tU;else document.getElementById("status").innerText="Gagal: "+await put.text();}catch(e){document.getElementById("status").innerText="Error: "+e.message;}}
</script></body></html>
